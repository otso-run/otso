# ============================================================================
# GMAIL (Takeout Mail mbox; its own db because mailboxes are large)
# ============================================================================

# Spam is left out of the index. The link opens the message in Gmail by
# its Message-ID, which works whatever the thread looks like now.
[[sources]]
name = "gmail"
enabled = true
db_path = "gmail/chronicle/chronicle.db"
category = "comms"

[[sources.queries]]
table = "messages"
entry_type = "email"
action_type = "SendAction"
object_type = "EmailMessage"
sql = """
SELECT
    source_id as external_id,
    CASE WHEN COALESCE(subject, '') = '' THEN '(no subject)' ELSE subject END as title,
    TRIM(
        'From: ' || COALESCE(sender, '') || char(10) ||
        'To: ' || COALESCE(recipients, '') || char(10) ||
        COALESCE(body, '') || char(10) ||
        COALESCE((SELECT group_concat(value, ' ') FROM json_each(attachments)), '')
    ) as content,
    date as occurred_at,
    CASE WHEN message_id IS NOT NULL
        THEN 'https://mail.google.com/mail/u/0/#search/rfc822msgid%3A' || replace(replace(replace(message_id, '%', '%25'), '+', '%2B'), '@', '%40')
    END as url,
    json_object('from', sender, 'to', recipients, 'cc', cc, 'labels', labels, 'attachments', json(attachments)) as metadata
FROM messages
WHERE ',' || COALESCE(labels, '') || ',' NOT LIKE '%,Spam,%'
"""
