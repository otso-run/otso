# ============================================================================
# TASKS & PRODUCTIVITY
# ============================================================================

[[sources]]
name = "things"
enabled = true
db_path = "things/chronicle/chronicle.db"
category = "productivity"

[[sources.queries]]
table = "events"
entry_type = "task"
action_type = "CreateAction"
object_type = "Action"
sql = """
SELECT
    source_id as external_id,
    name as title,
    COALESCE(description, '') as content,
    startTime as occurred_at,
    NULL as url
FROM events WHERE startTime IS NOT NULL
"""

[[sources.queries]]
table = "events"
entry_type = "task-completed"
action_type = "CompleteAction"
object_type = "Action"
sql = """
SELECT
    source_id || '-completed' as external_id,
    '✓ ' || name as title,
    COALESCE(description, '') as content,
    endTime as occurred_at,
    NULL as url
FROM events WHERE actionStatus = 'completed' AND endTime IS NOT NULL
"""

[[sources]]
name = "timing"
enabled = true
db_path = "timing/chronicle/chronicle.db"
category = "productivity"

# Timing can have 2M+ records - aggregate by app and project per day
[sources.aggregation]
strategy = "daily"
key_fields = ["title"]  # App name is in title field

[[sources.queries]]
table = "events"
entry_type = "activity"
action_type = "UseAction"
object_type = "SoftwareApplication"
sql = """
SELECT
    source_id as external_id,
    json_extract(agent, '$.name') as title,
    COALESCE(json_extract(object, '$.name'), '') || ' ' || COALESCE(json_extract(result, '$.name'), '') as content,
    startTime as occurred_at,
    CASE
        WHEN json_extract(object, '$.url') LIKE 'file://http%'
        THEN SUBSTR(json_extract(object, '$.url'), 8)
        WHEN json_extract(object, '$.url') LIKE 'http%'
        THEN json_extract(object, '$.url')
        ELSE NULL
    END as url
FROM events
"""

