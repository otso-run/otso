# Otso Source Configuration
# This file defines all data sources for the indexer.
# Each source extracts events from a SQLite database using configured queries.
#
# For development/testing: use fixtures/ directory (anonymized mock data)
# For production: use sources/ directory (real user data - gitignored)

[defaults]
schema_version = "1.0"
# Change to "sources" for production use with real data
data_dir = "data/fixtures"

# ============================================================================
# BOOKMARKING & READING
# ============================================================================

[[sources]]
name = "pinboard"
enabled = true
db_path = "pinboard/chronicle/chronicle.db"
category = "reading"

[[sources.queries]]
table = "events"
entry_type = "bookmark"
action_type = "BookmarkAction"
object_type = "WebPage"
sql = """
SELECT
    source_id as external_id,
    json_extract(object, '$.name') as title,
    COALESCE(json_extract(object, '$.description'), '') || ' ' || COALESCE(json_extract(result, '$.name'), '') as content,
    end_time as occurred_at,
    json_extract(object, '$.url') as url
FROM events WHERE type = 'BookmarkAction'
"""

# Zotero library: saved items with their creators, abstract, tags, collections, notes and annotations.
[[sources]]
name = "zotero"
enabled = true
db_path = "zotero/chronicle/chronicle.db"
category = "reading"

[[sources.queries]]
table = "events"
entry_type = "save"
action_type = "BookmarkAction"
object_type = "CreativeWork"
sql = """
SELECT
    source_id as external_id,
    name as title,
    TRIM(
      COALESCE((SELECT group_concat(c.value, ', ') FROM json_each(json_extract(object, '$.creators')) c), '') || char(10) ||
      COALESCE(json_extract(object, '$.publication'), '') || ' ' || COALESCE(json_extract(object, '$.date'), '') || char(10) ||
      COALESCE(description, '') || char(10) || COALESCE(text, '') || char(10) ||
      COALESCE((SELECT group_concat(k.value, ' ') FROM json_each(json_extract(object, '$.keywords')) k), '') || ' ' ||
      COALESCE((SELECT group_concat(k.value, ' ') FROM json_each(json_extract(object, '$.collections')) k), '')
    ) as content,
    date_created as occurred_at,
    json_extract(object, '$.url') as url
FROM events
"""

[[sources]]
name = "readwise"
enabled = true
db_path = "readwise/chronicle/chronicle.db"
category = "reading"

[[sources.queries]]
table = "events"
entry_type = "highlight"
action_type = "HighlightAction"
object_type = "Quotation"
sql = """
SELECT
    source_id as external_id,
    json_extract(result, '$.name') as title,
    COALESCE(json_extract(object, '$.name'), '') as content,
    startTime as occurred_at,
    json_extract(object, '$.url') as url
FROM events WHERE type = 'HighlightAction'
"""

# Reader documents (saved articles, PDFs); RSS feed items are not synced.
# content is the author, summary and full article text (reader_content), so
# search finds words from the body; metadata is shown in the result detail.
[[sources.queries]]
table = "events"
entry_type = "article"
action_type = "ReadAction"
object_type = "Article"
sql = """
SELECT
    e.source_id as external_id,
    COALESCE(json_extract(e.object, '$.name'), json_extract(e.object, '$.url')) as title,
    TRIM(
        COALESCE(json_extract(e.object, '$.author') || char(10), '') ||
        COALESCE(json_extract(e.object, '$.summary') || char(10), '') ||
        COALESCE(c.text, ''),
        char(10) || ' '
    ) as content,
    e.startTime as occurred_at,
    json_extract(e.object, '$.url') as url,
    json_object(
        'author', json_extract(e.object, '$.author'),
        'site_name', json_extract(e.object, '$.site_name'),
        'category', json_extract(e.object, '$.category'),
        'published_date', json_extract(e.object, '$.published_date'),
        'word_count', json_extract(e.object, '$.word_count'),
        'reading_time', json_extract(e.object, '$.reading_time'),
        'summary', json_extract(e.object, '$.summary'),
        'image_url', json_extract(e.object, '$.image_url'),
        'reader_url', json_extract(e.object, '$.readerUrl'),
        'location', json_extract(e.result, '$.location'),
        'reading_progress', json_extract(e.result, '$.readingProgress'),
        'tags', json(json_extract(e.result, '$.tags')),
        'notes', json_extract(e.result, '$.notes'),
        'saved_at', COALESCE(json_extract(e.result, '$.savedAt'), e.startTime),
        'last_opened_at', COALESCE(json_extract(e.result, '$.lastOpenedAt'), e.endTime)
    ) as metadata
FROM events e
LEFT JOIN reader_content c ON c.source_id = e.source_id
WHERE e.type = 'ReadAction'
"""

