# Otso Source Configuration
# This file defines all data sources for the indexer.
# Each source extracts events from a SQLite database using configured queries.
#
# For development/testing: use fixtures/ directory (anonymized mock data)
# For production: use sources/ directory (real user data - gitignored)

[defaults]
schema_version = "1.0"
# Change to "sources" for production use with real data
data_dir = "data/fixtures"

# ============================================================================
# BOOKMARKING & READING
# ============================================================================

[[sources]]
name = "pinboard"
enabled = true
db_path = "pinboard/chronicle/chronicle.db"
category = "reading"

[[sources.queries]]
table = "events"
entry_type = "bookmark"
action_type = "BookmarkAction"
object_type = "WebPage"
sql = """
SELECT
    source_id as external_id,
    json_extract(object, '$.name') as title,
    COALESCE(json_extract(object, '$.description'), '') || ' ' || COALESCE(json_extract(result, '$.name'), '') as content,
    end_time as occurred_at,
    json_extract(object, '$.url') as url
FROM events WHERE type = 'BookmarkAction'
"""

[[sources]]
name = "readwise"
enabled = true
db_path = "readwise/chronicle/chronicle.db"
category = "reading"

[[sources.queries]]
table = "events"
entry_type = "highlight"
action_type = "HighlightAction"
object_type = "Quotation"
sql = """
SELECT
    source_id as external_id,
    json_extract(result, '$.name') as title,
    COALESCE(json_extract(object, '$.name'), '') as content,
    startTime as occurred_at,
    json_extract(object, '$.url') as url
FROM events
"""

