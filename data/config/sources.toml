db_path = "google-takeout/chronicle/chronicle.db"
category = "comms"

[[sources.queries]]
table = "google_voice"
entry_type = "message"
action_type = "SendAction"
object_type = "Message"
sql = """
SELECT
    source_id as external_id,
    name || CASE WHEN conversation <> name THEN ' · ' || conversation ELSE '' END as title,
    COALESCE(text, '') as content,
    startTime as occurred_at,
    NULL as url,
    json_object('number', number, 'conversation', conversation) as metadata
FROM google_voice WHERE kind = 'text'
"""

[[sources.queries]]
table = "google_voice"
entry_type = "call"
action_type = "CommunicateAction"
object_type = "PhoneCall"
sql = """
SELECT
    source_id as external_id,
    upper(substr(kind, 1, 1)) || substr(kind, 2) || ' call: ' || name as title,
    COALESCE(text, '') as content,
    startTime as occurred_at,
    NULL as url,
    json_object('kind', kind, 'number', number, 'duration_seconds', duration) as metadata
FROM google_voice WHERE kind <> 'text'
"""

