# ============================================================================
# SOCIAL MEDIA - TWITTER (Raw Archive Format)
# ============================================================================

[[sources]]
name = "twitter-mockuser"
enabled = true
db_path = "twitter-mockuser/chronicle/chronicle.db"
category = "social"

[[sources.queries]]
table = "tweets"
entry_type = "tweet"
action_type = "CreateAction"
object_type = "SocialMediaPosting"
sql = """
SELECT
    id as external_id,
    substr(full_text, 1, 100) as title,
    full_text as content,
    created_at as occurred_at,
    'https://twitter.com/mockuser/status/' || id as url
FROM tweets
"""

[[sources.queries]]
table = "likes"
entry_type = "like"
action_type = "LikeAction"
object_type = "SocialMediaPosting"
sql = """
SELECT
    tweet_id as external_id,
    substr(full_text, 1, 100) as title,
    full_text as content,
    CAST(((CAST(tweet_id AS INTEGER) >> 22) + 1288834974657) / 1000 AS TEXT) as occurred_at,
    expanded_url as url
FROM likes
"""

