# Google Chat: one row per message. The title names the sender and the
# space or DM, so a search result says who said it where.
[[sources]]
name = "google-chat"
enabled = true
db_path = "google-takeout/chronicle/chronicle.db"
category = "comms"

[[sources.queries]]
table = "google_chat"
entry_type = "message"
action_type = "SendAction"
object_type = "Message"
sql = """
SELECT
    source_id as external_id,
    sender || ' · ' || conversation as title,
    TRIM(COALESCE(text, '') || ' ' || COALESCE((SELECT group_concat(value, ' ') FROM json_each(attachments)), '')) as content,
    startTime as occurred_at,
    NULL as url,
    json_object('sender', sender, 'conversation', conversation, 'attachments', json(attachments)) as metadata
FROM google_chat
"""

# Google Voice: texts (one row per message) and calls; a voicemail's
# transcript is its content.
